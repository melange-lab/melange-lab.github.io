:root{color-scheme:light dark;--bg:#ffffff;--fg:#1b1d21;--mu:#5d6472;--line:#e2e5ea;--card:#f4f6f9;--link:#0a62c2;--ph:#fff1bf;--ph-t:#4f3b00}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:680px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav{display:flex;justify-content:space-between;gap:12px;font-size:15px}
nav a{display:inline-block;padding:8px 0}
h1{font-size:24px;line-height:1.35;margin:16px 0 4px}
h2{font-size:18px;line-height:1.4;margin:32px 0 8px;padding-top:20px;border-top:1px solid var(--line)}
h3{font-size:16px;margin:20px 0 6px}
p{margin:8px 0}
ul{margin:8px 0;padding-left:20px}
li{margin:4px 0}
a{color:var(--link)}
.meta{color:var(--mu);font-size:14px;margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:20px 0}
.box ul{padding-left:18px}
table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card);font-weight:600;width:34%}
.ph{background:var(--ph);color:var(--ph-t);border-radius:4px;padding:0 4px}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
</style>
<style media="(prefers-color-scheme: dark)">:root{--bg:#0e1014;--fg:#e8ebf0;--mu:#9ba3b1;--line:#2a2e37;--card:#171b22;--link:#74b6ff;--ph:#4a3b0c;--ph-t:#ffe7a3}</style>
